name: Build Little16 With Settings

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid dpkg make

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDKs
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/sdks"
          cp -R "$HOME/sdks/"*.sdk "$HOME/theos/sdks/"

      - name: Build package
        shell: bash
        run: |
          set -o pipefail
          gmake clean package FINALPACKAGE=1 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        run: grep -nE "error|\*\*\*|not found|No such" build.log | head -50 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: Little16WithSettings-deb
          path: packages/*.deb
          if-no-files-found: error
